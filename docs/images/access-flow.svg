<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="How to join the KAZI website editing team: ask, review, invite, accept, contribute">
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2328">Getting access to the KAZI website repository</text>
  <text x="450" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">You only do this once. After step 5 you can propose changes any time.</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="15" y="95" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="40" cy="120" r="13" fill="#0969da"/>
    <text x="40" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <text x="63" y="125" font-size="14" font-weight="bold" fill="#1f2328">Ask</text>
    <text x="30" y="155" font-size="12" fill="#1f2328">Open an issue or</text>
    <text x="30" y="172" font-size="12" fill="#1f2328">email the maintainer.</text>
    <text x="30" y="196" font-size="12" fill="#57606a">Say who you are and</text>
    <text x="30" y="212" font-size="12" fill="#57606a">what you want to edit.</text>

    <rect x="195" y="95" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="220" cy="120" r="13" fill="#0969da"/>
    <text x="220" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <text x="243" y="125" font-size="14" font-weight="bold" fill="#1f2328">Review</text>
    <text x="210" y="155" font-size="12" fill="#1f2328">The maintainer checks</text>
    <text x="210" y="172" font-size="12" fill="#1f2328">the request.</text>
    <text x="210" y="196" font-size="12" fill="#57606a">Only KAZI members</text>
    <text x="210" y="212" font-size="12" fill="#57606a">and trusted helpers.</text>

    <rect x="375" y="95" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="400" cy="120" r="13" fill="#0969da"/>
    <text x="400" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
    <text x="423" y="125" font-size="14" font-weight="bold" fill="#1f2328">Invite</text>
    <text x="390" y="155" font-size="12" fill="#1f2328">You are added as a</text>
    <text x="390" y="172" font-size="12" fill="#1f2328">collaborator with</text>
    <text x="390" y="189" font-size="12" font-weight="bold" fill="#1f2328">Write access.</text>
    <text x="390" y="212" font-size="12" fill="#57606a">Not admin. Not merge.</text>

    <rect x="555" y="95" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="580" cy="120" r="13" fill="#0969da"/>
    <text x="580" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
    <text x="603" y="125" font-size="14" font-weight="bold" fill="#1f2328">Accept</text>
    <text x="570" y="155" font-size="12" fill="#1f2328">GitHub emails you an</text>
    <text x="570" y="172" font-size="12" fill="#1f2328">invitation link.</text>
    <text x="570" y="196" font-size="12" fill="#57606a">Click it to confirm.</text>
    <text x="570" y="212" font-size="12" fill="#57606a">Expires in 7 days.</text>

    <rect x="735" y="95" width="150" height="130" rx="8" fill="#ddf4e4" stroke="#1a7f37"/>
    <circle cx="760" cy="120" r="13" fill="#1a7f37"/>
    <text x="760" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
    <text x="783" y="125" font-size="14" font-weight="bold" fill="#1f2328">Contribute</text>
    <text x="750" y="155" font-size="12" fill="#1f2328">You can now push</text>
    <text x="750" y="172" font-size="12" fill="#1f2328">branches and open</text>
    <text x="750" y="189" font-size="12" fill="#1f2328">pull requests.</text>
    <text x="750" y="212" font-size="12" font-weight="bold" fill="#1a7f37">See diagram 2.</text>
  </g>

  <g stroke="#57606a" stroke-width="2" marker-end="url(#a1)">
    <line x1="168" y1="160" x2="190" y2="160"/>
    <line x1="348" y1="160" x2="370" y2="160"/>
    <line x1="528" y1="160" x2="550" y2="160"/>
    <line x1="708" y1="160" x2="730" y2="160"/>
  </g>

  <text x="450" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Write access lets you propose changes. It does not let you publish them: only the maintainer can merge into main.</text>
</svg>
