# Pages CMS configuration (https://pagescms.org): web forms for volunteers.
# Every save commits to GitHub, and the GitHub Action then publishes the site.
media:
- name: projects
  label: Project photos
  input: public/assets/projects
  output: assets/projects
  extensions: &id001
  - jpg
  - jpeg
  - png
  - webp
- name: team
  label: Team photos
  input: public/assets/team
  output: assets/team
  extensions: *id001
- name: partners
  label: Partner logos
  input: public/assets/partners
  output: assets/partners
  extensions:
  - svg
  - jpg
  - jpeg
  - png
  - webp
- name: reports
  label: Report PDFs
  input: public/reports
  output: reports
  extensions:
  - pdf
content:
- name: projects
  label: Projects
  type: file
  path: public/data/projects.json
  format: json
  fields:
  - name: projects
    label: Projects (newest first)
    type: object
    list: true
    fields:
    - name: id
      label: ID, e.g. tz-2026-bakery-anna-mushi (lowercase, no spaces)
      type: string
      required: true
    - name: country
      label: Country
      type: select
      options:
        values:
        - value: tz
          label: Tanzania
        - value: td
          label: Chad
    - name: place
      label: Place (village or town)
      type: string
    - name: year
      label: Year the loan was granted
      type: number
    - name: category
      label: Category
      type: select
      options:
        values:
        - agriculture
        - crafts
        - health
        - food
        - services
        - culture
        - tech
    - name: status
      label: Status
      type: select
      options:
        values:
        - ongoing
        - completed
    - name: second_loan
      label: Second loan
      type: boolean
    - name: featured
      label: Show in the big photos at the top of the page
      type: boolean
    - name: title
      label: Title
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fr
        label: Français
        type: string
      - name: sw
        label: Kiswahili
        type: string
    - name: people
      label: Entrepreneur(s)
      type: string
    - name: summary
      label: Short summary (1-3 sentences, max ~45 words)
      type: object
      fields:
      - name: en
        label: English
        type: text
      - name: fr
        label: Français
        type: text
      - name: sw
        label: Kiswahili
        type: text
    - name: amount
      label: Loan amount, e.g. TZS 3,000,000 (≈ CHF 1,000)
      type: string
    - name: photo
      label: Photo
      type: image
      options:
        media: projects
    - name: report
      label: Report ID that tells this story, e.g. 2025
      type: string
    - name: note
      label: Internal note (never shown on the site)
      type: text
- name: team
  label: Teams
  type: file
  path: public/data/team.json
  format: json
  fields:
  - name: teams
    label: Teams
    type: object
    list: true
    fields:
    - name: id
      label: ID (ch, tz or td)
      type: string
    - name: name
      label: Team name
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fr
        label: Français
        type: string
      - name: sw
        label: Kiswahili
        type: string
    - name: intro
      label: Intro
      type: object
      fields:
      - name: en
        label: English
        type: text
      - name: fr
        label: Français
        type: text
      - name: sw
        label: Kiswahili
        type: text
    - name: members
      label: Members
      type: object
      list: true
      fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fr
          label: Français
          type: string
        - name: sw
          label: Kiswahili
          type: string
      - name: bio
        label: Bio (leave empty to show 'Bio coming soon')
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fr
          label: Français
          type: text
        - name: sw
          label: Kiswahili
          type: text
      - name: photo
        label: Photo (square)
        type: image
        options:
          media: team
- name: partners
  label: Partners
  type: file
  path: public/data/partners.json
  format: json
  fields:
  - name: intro
    label: Intro text
    type: object
    fields:
    - name: en
      label: English
      type: text
    - name: fr
      label: Français
      type: text
    - name: sw
      label: Kiswahili
      type: text
  - name: partners
    label: Partners
    type: object
    list: true
    fields:
    - name: name
      label: Name
      type: string
    - name: url
      label: Website (optional)
      type: string
    - name: logo
      label: Logo
      type: image
      options:
        media: partners
- name: reports
  label: Activity reports
  type: file
  path: public/data/reports.json
  format: json
  fields:
  - name: reports
    label: Reports (newest first)
    type: object
    list: true
    fields:
    - name: id
      label: ID, e.g. 2026
      type: string
    - name: label
      label: Label, e.g. 2026
      type: string
    - name: latest
      label: Latest report
      type: boolean
    - name: subtitle
      label: Subtitle
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fr
        label: Français
        type: string
      - name: sw
        label: Kiswahili
        type: string
    - name: pdf_en
      label: PDF in English
      type: file
      options:
        media: reports
    - name: pdf_fr
      label: PDF in French
      type: file
      options:
        media: reports
- name: stats
  label: Key figures
  type: file
  path: public/data/stats.json
  format: json
  fields:
  - name: stats
    label: Key figures
    type: object
    list: true
    fields:
    - name: value
      label: Number, e.g. 50+
      type: string
    - name: label
      label: Label
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fr
        label: Français
        type: string
      - name: sw
        label: Kiswahili
        type: string
