name: Deploy website

# Push to "main"    -> live site     https://<domain>
# Push to "preview" -> preview site  https://preview.<domain>
on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check data files
        run: python3 scripts/check_data.py

      - name: Upload to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TARGET: ${{ github.ref_name == 'main' && 'live' || 'preview' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_HOST / VPS_SSH_KEY secrets are not set yet: skipping upload."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # rrsync on the server roots every path at /var/www/kazi
          rsync -rlz --delete --chmod=D755,F644 public/ "deploy@$VPS_HOST:$TARGET/"
          echo "Deployed $GITHUB_SHA to $TARGET"
